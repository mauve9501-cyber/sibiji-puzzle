}
function shapeMarkup(s,fill,stroke){
  const sw=stroke?` stroke="${stroke}" stroke-width="1.1" stroke-linejoin="round"`:'';
  if(s.t==='path')return `<path d="${s.d}" fill="${fill||s.fill}"${sw}/>`;
  return `<circle cx="${s.cx}" cy="${s.cy}" r="${s.r}" fill="${fill||s.fill}"${sw}/>`;
}

ANIMALS.forEach((z,i)=>{
  const b=document.createElement('button');b.className='z';b.type='button';
  if(!z.shapes){b.disabled=true;b.title='준비중 (SVG 추가 예정)';}
  b.innerHTML=`<span class="dot" style="background:var(${CVAR[z.hue]})"></span><span class="ji">${z.ji}</span><span class="nm">${z.animal}</span>`;
  b.addEventListener('click',()=>{if(z.shapes)select(i);});$('strip').appendChild(b);
});
function firstReady(){return ANIMALS.findIndex(a=>a.shapes);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function measure(){stagePx=stage.getBoundingClientRect().width;}
new ResizeObserver(()=>{measure();layout();}).observe(stage);

function select(i){idx=i;const z=ANIMALS[idx];slots.setAttribute('viewBox',`0 0 ${z.W} ${z.H}`);build();renderMeta();}
function build(){
  const z=ANIMALS[idx];
  // bbox 측정 후 유효 도형만 조각화
  meas.setAttribute('viewBox',`0 0 ${z.W} ${z.H}`);meas.innerHTML='';
  const valid=[];
  z.shapes.forEach(s=>{
    const el=shapeEl(s);meas.appendChild(el);const bb=el.getBBox();
    if(bb.width>=1.5&&bb.height>=1.5)valid.push({s,bx:bb.x,by:bb.y,bw:bb.width,bh:bb.height});
  });
  meas.innerHTML='';
  pieces=valid.map((v,i)=>{
    const cx=v.bx+v.bw/2, cy=v.by+v.bh/2;
    return {z,...v,txf:OFF+(cx/z.W)*MARGIN,tyf:OFF+(cy/z.H)*MARGIN,inStage:false,solved:false,sx:0,sy:0,order:i};
  });
  shuffle(pieces).forEach((p,i)=>{p.order=i;p.sx=p.txf;p.sy=p.tyf;});
  pieces.forEach(p=>{
    const btn=document.createElement('button');btn.type='button';btn.className='piece';btn.setAttribute('aria-label','조각');
    btn.innerHTML=`<svg viewBox="${p.bx.toFixed(2)} ${p.by.toFixed(2)} ${p.bw.toFixed(2)} ${p.bh.toFixed(2)}">${shapeMarkup(p.s,fillOf(p.s))}</svg>`;
    btn.addEventListener('pointerdown',e=>startDrag(e,p));p.el=btn;
  });
  measure();renderSlots();layout();
}
function sizePiece(p,el){const s=MARGIN*stagePx/p.z.W;el.style.width=(p.bw*s)+'px';el.style.height=(p.bh*s)+'px';}
function renderSlots(){
  const mode=DIFF[diff].slot;let s='';
  pieces.forEach(p=>{
    if(mode==='color')s+=shapeMarkup(p.s,fillOf(p.s),null).replace('/>',' opacity="0.24"/>');
    else if(mode==='gray')s+=shapeMarkup(p.s,'var(--slot)',null).replace('/>',' opacity="0.5"/>');
    else s+=shapeMarkup(p.s,'none','var(--slot)').replace('stroke-width="1.1"','stroke-width="1.1" opacity="0.7"');
  });
  slots.innerHTML=s;slots.style.display=peeking?'none':'block';
}
function layout(){
  tray.innerHTML='';
  const inTray=pieces.filter(p=>!p.inStage).sort((a,b)=>a.order-b.order);
  if(!inTray.length)tray.innerHTML='<div class="tray-empty">모든 조각을 올렸어요</div>';
  inTray.forEach(p=>{p.el.className='piece';sizePiece(p,p.el);tray.appendChild(p.el);});
  pieces.filter(p=>p.inStage).forEach(p=>{
    p.el.className='piece instage'+(p.solved?' solved':'');
    sizePiece(p,p.el);p.el.style.left=p.sx*100+'%';p.el.style.top=p.sy*100+'%';stage.appendChild(p.el);
  });
  updateProgress();
}
function startDrag(e,p){
  if(p.solved)return;e.preventDefault();dragging=p;
  const r=p.el.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
  grab.x=e.clientX-cx;grab.y=e.clientY-cy;sizePiece(p,p.el);
  const w=p.el.offsetWidth,h=p.el.offsetHeight;
  document.body.appendChild(p.el);p.el.className='piece dragging';
  p.el.style.left=(cx-w/2)+'px';p.el.style.top=(cy-h/2)+'px';
  moveDrag(e);window.addEventListener('pointermove',moveDrag);window.addEventListener('pointerup',endDrag);
}
function moveDrag(e){
  if(!dragging)return;const p=dragging,w=p.el.offsetWidth,h=p.el.offsetHeight;
  const cx=e.clientX-grab.x,cy=e.clientY-grab.y;
  p.el.style.left=(cx-w/2)+'px';p.el.style.top=(cy-h/2)+'px';
  const r=stage.getBoundingClientRect();
  stage.classList.toggle('dragover',cx>r.left&&cx<r.right&&cy>r.top&&cy<r.bottom);
}
function endDrag(e){
  window.removeEventListener('pointermove',moveDrag);window.removeEventListener('pointerup',endDrag);
  stage.classList.remove('dragover');const p=dragging;dragging=null;if(!p)return;
  const cx=e.clientX-grab.x,cy=e.clientY-grab.y;const r=stage.getBoundingClientRect();
  if(cx>r.left&&cx<r.right&&cy>r.top&&cy<r.bottom){
    p.inStage=true;p.sx=(cx-r.left)/r.width;p.sy=(cy-r.top)/r.height;
    if(Math.hypot(p.sx-p.txf,p.sy-p.tyf)<=DIFF[diff].tol){p.sx=p.txf;p.sy=p.tyf;p.solved=true;}
  }else p.inStage=false;
  layout();
  if(pieces.length&&pieces.every(x=>x.solved))setTimeout(win,340);
}
function renderMeta(){
  const z=ANIMALS[idx];
  $('snJi').textContent=z.ji;$('snName').textContent=z.animal;$('snDir').textContent=z.dir;
  document.querySelectorAll('.z').forEach((b,i)=>b.setAttribute('aria-current',i===idx?'true':'false'));
  $('mAnimal').textContent=`${z.ji} · ${z.animal}`;$('mDir').textContent=z.dir;
  $('mChip').innerHTML=`<i style="background:var(${CVAR[z.hue]})"></i>${z.ohaeng}(${HJ[z.hue]}) · ${HNAME[z.hue]}`;
  $('mSym').textContent=z.sym;
  $('whyH').textContent=`왜 ${z.animal}는 ${COLORWORD[z.hue]}일까?`;$('mWhy').textContent=z.why;
}
function updateProgress(){
  const done=pieces.filter(p=>p.solved).length;
  $('prog').textContent=`맞춘 조각 ${done} / ${pieces.length}`;
  $('trayCount').textContent=`${pieces.filter(p=>!p.inStage).length}개 남음`;
  $('pc').textContent=pieces.length+'조각';
}
function win(){
  const z=ANIMALS[idx];
  $('winSvg').innerHTML=`<svg viewBox="0 0 ${z.W} ${z.H}" width="150" height="150">${z.shapes.map(s=>shapeMarkup(s,fillOf(s))).join('')}</svg>`;
  $('winName').textContent=z.animal;
  $('winJi').textContent=`${z.ji} · ${z.dir} · ${z.ohaeng}(${HJ[z.hue]})·${HNAME[z.hue]}`;
  $('winWhy').textContent=z.why;$('win').classList.add('show');
}
$('peekBtn').addEventListener('click',()=>{peeking=!peeking;
  if(peeking){slots.innerHTML=ANIMALS[idx].shapes.map(s=>shapeMarkup(s,fillOf(s))).join('');slots.style.display='block';slots.style.opacity='0.85';}
  else{slots.style.opacity='';renderSlots();}});
$('diff').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  diff=b.dataset.d;[...$('diff').children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderSlots();});
$('pal').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  palette=b.dataset.p;[...$('pal').children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  pieces.forEach(p=>{const svg=p.el.querySelector('svg');if(svg)svg.innerHTML=shapeMarkup(p.s,fillOf(p.s));});
  if(peeking){peeking=false;}renderSlots();});
$('resetBtn').addEventListener('click',()=>build());
$('winAgain').addEventListener('click',()=>{$('win').classList.remove('show');build();});
$('winNext').addEventListener('click',()=>{$('win').classList.remove('show');});
$('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');renderSlots();});
select(firstReady());
</script>

</body></html>
